name: Godot Validate

on:
  workflow_dispatch:
  push:
    paths: ["game/**", "ci/**", ".github/workflows/godot-validate.yml"]
  pull_request:
    paths: ["game/**", "ci/**", ".github/workflows/godot-validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Import and smoke test
        run: bash ci/validate-game.sh
