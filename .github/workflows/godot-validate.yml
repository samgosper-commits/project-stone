name: Godot Validate

on:
  workflow_dispatch:
  push:
    paths: ["game/**", "ci/**", ".github/workflows/godot-validate.yml"]
  pull_request:
    paths: ["game/**", "ci/**", ".github/workflows/godot-validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Import and smoke test
        run: bash ci/validate-game.sh

  render:
    name: Render Android control preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4-stable_linux.x86_64
      - name: Render and test the scene
        run: |
          mkdir -p build/preview
          /tmp/godot/Godot_v4.4-stable_linux.x86_64 --headless --path game --editor --import
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 /tmp/godot/Godot_v4.4-stable_linux.x86_64 --path game --script ../ci/render-check.gd -- --touch-preview --capture="$PWD/build/preview/ProjectStone-0.1.1.png" 2>&1 | tee build/preview/render.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:' build/preview/render.log
          test -s build/preview/ProjectStone-0.1.1.png
      - uses: actions/upload-artifact@v4
        with:
          name: Rendered-Scene-Preview
          path: build/preview/
          if-no-files-found: error
