name: Build Alpha
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/build-alpha.yml"]
jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: mkdir -p ~/.local/share/godot/export_templates/4.4.stable && cp -r /root/.local/share/godot/export_templates/4.4.stable/* ~/.local/share/godot/export_templates/4.4.stable/ || true
      - name: Import
        run: godot --headless --path game --editor --quit
      - name: Build Windows alpha
        run: mkdir -p build/windows && godot --headless --path game --export-debug "Windows Desktop" ../build/windows/ProjectStoneAlpha.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Stone-Alpha-Windows
          path: build/windows/
