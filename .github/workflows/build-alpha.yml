name: Build Alpha

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["game/**", "ci/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["game/**", "ci/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  export:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.4
    strategy:
      fail-fast: false
      matrix:
        platform: [Windows, Android]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot and export templates
        run: bash ci/prepare-godot.sh "${{ matrix.platform }}"
      - name: Import and smoke test
        run: bash ci/validate-game.sh
      - name: Export and verify game file
        run: bash ci/export-alpha.sh "${{ matrix.platform }}"
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Project-Stone-Alpha-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 90
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs-${{ matrix.platform }}
          path: build/logs/
          if-no-files-found: ignore
